name: Android verification and APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test-results.log 2>&1
          result=$?
          cat test-results.log
          if [ "$result" -ne 0 ]; then
            python3 -c 'from pathlib import Path; lines=Path("test-results.log").read_text().splitlines(); indices=[i for i,s in enumerate(lines) if any(x in s for x in ("[E]", "EXCEPTION CAUGHT", "Expected:", "Error:"))]; t="\n".join(lines[max(0,indices[0]-1):indices[0]+38] if indices else lines[-25:])[:3500]; print("::error title=Flutter tests::"+t.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$result"
      - name: Build debug APK
        run: flutter build apk --debug -t lib/main.dart
      - name: Save APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: home-plants-organizer-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

name: home_plants_organizer
description: Мобильный органайзер домашних растений с календарём ухода.
publish_to: none
version: 1.3.3+8
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  path_provider: ^2.1.5
  sqflite: 2.4.4
  hive_ce: 2.20.1
  path: 1.9.1
  http: 1.6.0
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  flutter_timezone: 5.1.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
flutter:
  uses-material-design: true
  assets:
    - assets/botanical_profiles.json
    - assets/labels/
